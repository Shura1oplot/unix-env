onboarding = false

[keys]
cycle_pane_next = "shift+tab"

# tools/herdr-pathpick in the zemlekop repository.
[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "zemlekop.pathpick.pick"
description = "pick a file path on screen"

# tools/usage-limits in the zemlekop repository; q or Esc Esc closes.
[[keys.command]]
key = "prefix+u"
type = "popup"
command = "\"$HOME/.local/bin/usage-limits\" --watch"
description = "show usage limits"
width = 51
height = 15

[ui.toast]
delivery = "terminal"

[theme]
name = "vesper"
auto_switch = false

[update]
channel = "stable"
